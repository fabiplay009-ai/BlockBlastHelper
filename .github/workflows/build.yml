name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK bauen
        run: gradle assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk BlockBlastHelper.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BlockBlastHelper-apk
          path: BlockBlastHelper.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BlockBlastHelper (neueste Version)
          prerelease: false
          make_latest: true
          files: BlockBlastHelper.apk

  # Automatik im Simulator testen (echter Code aus Vision/AutoBrain/Solver auf nachgebauten Spielbildern).
  # Schlägt fehl, wenn weniger als 95 % der Teile richtig landen. Blockiert die APK nicht.
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Simulator laufen lassen
        run: |
          mkdir -p out
          javac -nowarn -encoding UTF-8 -d out app/src/main/java/com/example/bbhelper/{Vision,AutoBrain,Solver}.java sim/Sim.java
          java -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -cp out Sim 3
